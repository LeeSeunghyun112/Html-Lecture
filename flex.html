<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        div{width: 500px; height: 500px; margin: 0 auto;
        border: 5px solid gray; display: flex;
        justify-content: flex-start;
        align-items: center;
        font-size: 20px;}

        #box1{background-color: red; font-size: 2em;}
        #box2{background-color: blue; font-size: 2em;}
        #box3{background-color: green; font-size: 2rem;}

        p{width: 100px; height: 100px; color: white;}
    </style>
</head>
<body>
    <div>
        <p id="box1">박스1</p>
        <p id="box2">박스2</p>
        <p id="box3">박스3</p>
    </div>
</body>
</html>
