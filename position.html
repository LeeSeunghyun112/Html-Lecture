<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포지션 position</title>
    <style>
        *{margin: 0; padding: 0; box-sizing:border-box;}
        div{border: 5px solid #ccc; width: 500px; height: 2500px;
        position: relative;
        /* position: absolute;의 기준으로 사용 */
        }
        p{width: 100px; height: 100px;}
        p:nth-child(1){background-color: #f00;}
        p:nth-child(2){background-color: #00f;
        /*position: static;/ relative;*/
        /* position: relative; top: 150px; left: 150px; */
        /* position: absolute; top: 500px; left: 500px; */
        position: fixed; /* 브라우져 기준 고정 */
    top:50px;right:50px;
        }
        p:nth-child(3){background-color: #ff0;}

    </style>
</head>
<body>
    <h1>제목1위치</h1>
    <h1>제목2위치</h1>
    <h1>제목3위치</h1>
    <div>
        <p>박스1</p>
        <p>박스2</p>
        <p>박스3</p>
    </div>

</body>
</html>
